# Builds the common Bukkit Jar and checks the supported API boundaries.

name: Compatibility Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build against the Spigot baseline
      run: mvn -B clean verify --file pom.xml

    - name: Verify Folia 1.19.4 scheduler signatures
      run: mvn -B -Pfolia-compat test --file pom.xml

    - name: Inspect the common server Jar
      shell: bash
      run: |
        plugin_jar="$(find target -maxdepth 1 -name 'MCEEW-*.jar' -print -quit)"
        test -n "$plugin_jar"
        if jar tf "$plugin_jar" | grep -Eq '^(org/bukkit|io/papermc|net/kyori)/'; then
          echo "The plugin Jar contains a server API or Adventure implementation."
          exit 1
        fi
        unzip -p "$plugin_jar" plugin.yml | grep -Fx 'folia-supported: true'
        unzip -p "$plugin_jar" plugin.yml | grep -Fx 'api-version: 1.13'
