# Builds the Bukkit and Velocity Jars and checks the supported API boundaries.

name: Compatibility Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build against the Spigot baseline
      run: mvn -B clean verify --file pom.xml

    - name: Verify Folia scheduler signatures
      run: mvn -B -Pfolia-compat test --file pom.xml

    - name: Inspect the platform-neutral core Jar
      shell: bash
      run: |
        shopt -s nullglob
        core_jars=(mceew-core/target/mceew-core-*.jar)
        if (( ${#core_jars[@]} != 1 )); then
          echo "Expected exactly one core reactor Jar, found ${#core_jars[@]}."
          exit 1
        fi
        core_jar="${core_jars[0]}"
        core_entries="$(jar tf "$core_jar")"

        if grep -Eq '^(org/bukkit|io/papermc|dev/folia|com/velocitypowered|net/kyori/adventure|org/bstats)/' <<<"$core_entries"; then
          echo "The core Jar contains a platform API class."
          exit 1
        fi
        if grep -Eq '(^|/)(plugin|config)\.yml$|(^|/)[^/]*Test[^/]*\.class$' <<<"$core_entries"; then
          echo "The core Jar contains platform metadata or tests."
          exit 1
        fi

        core_class_dir="$(mktemp -d)"
        trap 'rm -rf "$core_class_dir"' EXIT
        unzip -q "$core_jar" '*.class' -d "$core_class_dir"
        if grep -aERq 'org/bukkit|io/papermc|dev/folia|com/velocitypowered|net/kyori/adventure|org/bstats' "$core_class_dir"; then
          echo "Core bytecode references a platform API."
          exit 1
        fi
        while IFS= read -r class_file; do
          major="$(od -An -tu2 -j6 -N2 --endian=big "$class_file" | tr -d ' ')"
          if [[ "$major" != 55 ]]; then
            echo "$class_file targets class major $major instead of 55."
            exit 1
          fi
        done < <(find "$core_class_dir" -name '*.class' -type f -print)

    - name: Inspect the Bukkit server Jar
      shell: bash
      run: |
        shopt -s nullglob
        plugin_jars=(mceew-bukkit/target/MCEEW-*.jar)
        if (( ${#plugin_jars[@]} != 1 )); then
          echo "Expected exactly one Bukkit distribution Jar, found ${#plugin_jars[@]}."
          exit 1
        fi
        plugin_jar="${plugin_jars[0]}"
        jar_entries="$(jar tf "$plugin_jar")"

        if grep -Eq '^(org/bukkit|io/papermc|com/destroystokyo|dev/folia|net/minecraft|org/spigotmc|net/kyori)/' <<<"$jar_entries"; then
          echo "The plugin Jar contains a server API or Adventure implementation."
          exit 1
        fi

        if grep -Eq '^(com/google/gson|org/bstats)/' <<<"$jar_entries"; then
          echo "The plugin Jar contains an unrelocated Gson or bStats class."
          exit 1
        fi
        grep -Fx 'jp/wolfx/mceew/libs/gson/Gson.class' <<<"$jar_entries"
        grep -Fx 'jp/wolfx/mceew/libs/bstats/bukkit/Metrics.class' <<<"$jar_entries"
        test "$(grep -Fxc 'jp/wolfx/mceew/EarthquakeInfoCache.class' <<<"$jar_entries")" -eq 1

        if grep -Eq '(^|/)[^/]*Test[^/]*\.class$|^config-history/|^websocket/|(^|/)mceew-core-[^/]*\.jar$' <<<"$jar_entries"; then
          echo "The production Jar contains tests, test fixtures, or a nested core Jar."
          exit 1
        fi

        expected_version="$(mvn -q -pl mceew-bukkit help:evaluate \
          -Dexpression=project.version -DforceStdout)"
        if [[ -z "$expected_version" ]]; then
          echo "Maven returned an empty Bukkit project version."
          exit 1
        fi
        unzip -p "$plugin_jar" plugin.yml | grep -Fx "version: $expected_version"
        unzip -p "$plugin_jar" plugin.yml | grep -Fx 'main: jp.wolfx.mceew.MCEEW'
        unzip -p "$plugin_jar" plugin.yml | grep -Fx 'folia-supported: true'
        unzip -p "$plugin_jar" plugin.yml | grep -Fx 'api-version: 1.13'
        unzip -p "$plugin_jar" config.yml | grep -Fx 'config-version: 9'

        class_dir="$(mktemp -d)"
        trap 'rm -rf "$class_dir"' EXIT
        unzip -q "$plugin_jar" 'jp/wolfx/mceew/*.class' -d "$class_dir"
        while IFS= read -r class_file; do
          major="$(od -An -tu2 -j6 -N2 --endian=big "$class_file" | tr -d ' ')"
          if [[ "$major" != 55 ]]; then
            echo "$class_file targets class major $major instead of 55."
            exit 1
          fi
        done < <(find "$class_dir/jp/wolfx/mceew" -name '*.class' -type f ! -path '*/libs/*' -print)

    - name: Inspect the Velocity proxy Jar
      shell: bash
      run: |
        shopt -s nullglob
        velocity_jars=(mceew-velocity/target/MCEEW-Velocity-*.jar)
        if (( ${#velocity_jars[@]} != 1 )); then
          echo "Expected exactly one Velocity distribution Jar, found ${#velocity_jars[@]}."
          exit 1
        fi
        velocity_jar="${velocity_jars[0]}"
        jar_entries="$(jar tf "$velocity_jar")"

        if grep -Eq '^(com/velocitypowered|org/bukkit|io/papermc|dev/folia|net/kyori/adventure|org/bstats)/' <<<"$jar_entries"; then
          echo "The Velocity Jar contains a platform API or bStats class."
          exit 1
        fi
        if grep -Eq '^(com/google/gson|org/yaml/snakeyaml)/' <<<"$jar_entries"; then
          echo "The Velocity Jar contains an unrelocated library."
          exit 1
        fi
        grep -Fx 'jp/wolfx/mceew/velocity/libs/gson/Gson.class' <<<"$jar_entries"
        grep -Fx 'jp/wolfx/mceew/velocity/libs/snakeyaml/Yaml.class' <<<"$jar_entries"
        test "$(grep -Fxc 'jp/wolfx/mceew/websocket/WebSocketConnectionManager.class' <<<"$jar_entries")" -eq 1
        test "$(grep -Fxc 'jp/wolfx/mceew/velocity/MCEEWVelocity.class' <<<"$jar_entries")" -eq 1
        test "$(grep -Fxc 'jp/wolfx/mceew/velocity/VelocityCommand.class' <<<"$jar_entries")" -eq 1
        test "$(grep -Fxc 'jp/wolfx/mceew/velocity/VelocityTargetResolver.class' <<<"$jar_entries")" -eq 1
        test "$(grep -Fxc 'jp/wolfx/mceew/velocity/VelocityNotificationDispatcher.class' <<<"$jar_entries")" -eq 1

        if grep -Eq '(^|/)[^/]*Test[^/]*\.class$|^runtime-smoke/|(^|/)mceew-core-[^/]*\.jar$' <<<"$jar_entries"; then
          echo "The Velocity Jar contains tests, fixtures, or a nested core Jar."
          exit 1
        fi

        expected_version="$(mvn -q -pl mceew-velocity help:evaluate \
          -Dexpression=project.version -DforceStdout)"
        metadata_version="$(unzip -p "$velocity_jar" velocity-plugin.json | \
          python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
        metadata_main="$(unzip -p "$velocity_jar" velocity-plugin.json | \
          python3 -c 'import json, sys; print(json.load(sys.stdin)["main"])')"
        test "$metadata_version" = "$expected_version"
        test "$metadata_main" = 'jp.wolfx.mceew.velocity.MCEEWVelocity'
        unzip -p "$velocity_jar" config.yml | grep -Fx 'platform_config_version: 1'
        unzip -p "$velocity_jar" config.yml | grep -Fx '  enabled: true'
        unzip -p "$velocity_jar" config.yml | grep -Fx 'notifications:'
        unzip -p "$velocity_jar" config.yml | grep -Fx '  time_format: "yyyy年MM月dd日 HH時mm分ss秒"'
        unzip -p "$velocity_jar" config.yml | grep -Fx '    broadcast: true'
        unzip -p "$velocity_jar" config.yml | grep -Fx '    alert: true'
        for key in enable_jp enable_sc enable_fj enable_cwa enable_cenceew enable_cq; do
          unzip -p "$velocity_jar" config.yml | grep -Fx "    $key: true"
        done
        for source in jma_alert jma_forecast sichuan fujian cwa cenc_eew chongqing jma_eqlist cenc_eqlist; do
          unzip -p "$velocity_jar" config.yml | grep -Fx "    $source:"
        done
        if unzip -p "$velocity_jar" config.yml | grep -Eq \
          '^[[:space:]]*(platform-config-version|time-format|jma-alert|jma-forecast|cenc-eew|jma-eqlist|cenc-eqlist):'; then
          echo "The Velocity config contains a retired kebab-case identifier."
          exit 1
        fi

        compile_api="$(mvn -q -pl mceew-velocity help:evaluate \
          -Dexpression=velocity.api.version -DforceStdout)"
        test "$compile_api" = '3.4.0'

        class_dir="$(mktemp -d)"
        trap 'rm -rf "$class_dir"' EXIT
        unzip -q "$velocity_jar" 'jp/wolfx/mceew/*.class' -d "$class_dir"
        core_jar=(mceew-core/target/mceew-core-*.jar)
        core_entries="$(jar tf "${core_jar[0]}")"
        while IFS= read -r class_file; do
          entry="${class_file#"$class_dir/"}"
          major="$(od -An -tu2 -j6 -N2 --endian=big "$class_file" | tr -d ' ')"
          expected_major=61
          if grep -Fxq "$entry" <<<"$core_entries"; then
            expected_major=55
          fi
          if [[ "$major" != "$expected_major" ]]; then
            echo "$class_file targets class major $major instead of $expected_major."
            exit 1
          fi
        done < <(find "$class_dir/jp/wolfx/mceew" -name '*.class' -type f ! -path '*/libs/*' -print)

        while IFS= read -r class_file; do
          if grep -aEq 'com/velocitypowered/proxy/|java/lang/reflect|MinecraftPacket' \
            "$class_file"; then
            echo "$class_file references Velocity internals, reflection, or packet classes."
            exit 1
          fi
        done < <(find "$class_dir/jp/wolfx/mceew/velocity" -name '*.class' -type f \
          ! -path '*/libs/*' -print)

        command_registration="$(javap -classpath "$velocity_jar" -c -p \
          jp.wolfx.mceew.velocity.MCEEWVelocity)"
        grep -F 'CommandManager.metaBuilder:(Ljava/lang/String;)' <<<"$command_registration"
        grep -F 'CommandManager.register:(Lcom/velocitypowered/api/command/CommandMeta;Lcom/velocitypowered/api/command/Command;)V' \
          <<<"$command_registration"
        if grep -Fq 'CommandManager.register:(Ljava/lang/String;' <<<"$command_registration"; then
          echo "The Velocity plugin uses the deprecated string command registration overload."
          exit 1
        fi

    - name: Assemble Velocity runtime smoke fixture
      shell: bash
      run: |
        smoke_stage="$(mktemp -d)"
        trap 'rm -rf "$smoke_stage"' EXIT
        mkdir -p "$smoke_stage/jp/wolfx/mceew/velocity/smoke"
        cp mceew-velocity/target/test-classes/jp/wolfx/mceew/velocity/smoke/VelocitySchedulerRuntimeProbe.class \
          "$smoke_stage/jp/wolfx/mceew/velocity/smoke/"
        cp mceew-velocity/src/test/resources/runtime-smoke/velocity-plugin.json \
          "$smoke_stage/velocity-plugin.json"
        jar --create --file mceew-velocity/target/mceew-phase1-runtime-smoke.jar \
          -C "$smoke_stage" .

    - name: Upload Velocity runtime smoke artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velocity-phase1-runtime-smoke
        path: |
          mceew-velocity/target/MCEEW-Velocity-*.jar
          mceew-velocity/target/mceew-phase1-runtime-smoke.jar
        if-no-files-found: error

  velocity-runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - velocity: '3.4.0 build 566'
            java: '17'
            server: 'velocity-3.4.0-566.jar'
            sha256: 'fb599cbda6a6d01decce5e281f71f51cae7cacffcfafca32a09601f407b0583e'
            url: 'https://fill-data.papermc.io/v1/objects/fb599cbda6a6d01decce5e281f71f51cae7cacffcfafca32a09601f407b0583e/velocity-3.4.0-566.jar'
          - velocity: '3.5.1 build 615'
            java: '21'
            server: 'velocity-3.5.1-615.jar'
            sha256: 'b4e3164df5377346854dc6cb9e6a78022b1946ff69e89676313f5f6f1c6f0fb3'
            url: 'https://fill-data.papermc.io/v1/objects/b4e3164df5377346854dc6cb9e6a78022b1946ff69e89676313f5f6f1c6f0fb3/velocity-3.5.1-615.jar'
          - velocity: '4.0.0 build 6'
            java: '25'
            server: 'velocity-4.0.0-6.jar'
            sha256: '4540289f48c83e305fc2f2c495a84d1f4d0b7f360830251e169dd5a208740e70'
            url: 'https://fill-data.papermc.io/v1/objects/4540289f48c83e305fc2f2c495a84d1f4d0b7f360830251e169dd5a208740e70/velocity-4.0.0-6.jar'
    name: Velocity ${{ matrix.velocity }} / Java ${{ matrix.java }}
    steps:
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Download MCEEW runtime smoke artifacts
      uses: actions/download-artifact@v4
      with:
        name: velocity-phase1-runtime-smoke
        path: artifacts

    - name: Download pinned official Velocity server
      shell: bash
      run: |
        curl --fail --location --silent --show-error \
          '${{ matrix.url }}' --output '${{ matrix.server }}'
        echo '${{ matrix.sha256 }}  ${{ matrix.server }}' | sha256sum --check

    - name: Smoke-load the real MCEEW Velocity Jar
      shell: bash
      run: |
        shopt -s nullglob
        plugin_jars=(artifacts/MCEEW-Velocity-*.jar)
        if (( ${#plugin_jars[@]} != 1 )); then
          echo "Expected exactly one MCEEW Velocity Jar, found ${#plugin_jars[@]}."
          exit 1
        fi
        runtime="$(mktemp -d)"
        trap 'rm -rf "$runtime"' EXIT
        mkdir -p "$runtime/plugins"
        cp "${plugin_jars[0]}" "$runtime/plugins/"
        cp artifacts/mceew-phase1-runtime-smoke.jar "$runtime/plugins/"
        cp '${{ matrix.server }}' "$runtime/velocity.jar"
        mkdir -p "$runtime/plugins/mceew"
        cat > "$runtime/plugins/mceew/config.yml" <<'EOF'
        platform_config_version: 1
        global:
          enabled: false
        targets:
          default:
            mode: all
          sources: {}
        groups: {}
        servers: {}
        EOF

        cd "$runtime"
        set -o pipefail
        (sleep 5; echo eew; echo mceew; echo 'eew reload'; sleep 2; echo shutdown) | \
          timeout 30s java -jar velocity.jar 2>&1 | tee runtime.log

        grep -F 'Loaded plugin mceew ' runtime.log
        grep -F 'MCEEW Velocity ' runtime.log | grep -F 'platform shell initialized.'
        grep -F 'MCEEW Velocity operational runtime is disabled by configuration.' runtime.log
        test "$(grep -Fc '[MCEEW] Plugin version: v' runtime.log)" -ge 2
        grep -F '[MCEEW] Configuration reloaded successfully.' runtime.log
        grep -F 'MCEEW Velocity scheduler smoke task executed.' runtime.log
        grep -F 'MCEEW Velocity platform shell shut down.' runtime.log
        grep -F 'MCEEW Velocity scheduler smoke probe shut down.' runtime.log
        test -f plugins/mceew/config.yml
        grep -Fx 'platform_config_version: 1' plugins/mceew/config.yml
        grep -Fx '  enabled: false' plugins/mceew/config.yml
        if grep -Fq 'Connected to WebSocket API.' runtime.log; then
          echo "Velocity runtime smoke unexpectedly opened the Wolfx WebSocket."
          exit 1
        fi
        if grep -Eq 'NoClassDefFoundError|UnsupportedClassVersionError|NoSuchMethodError|AbstractMethodError|LinkageError' runtime.log; then
          echo "Velocity runtime smoke found a linkage failure."
          exit 1
        fi
