platform-config-version: 1

# Proxy-global services. Exactly one Wolfx/cache/parser pipeline is created per proxy.
global:
  enabled: true
  sources:
    jma: true
    sichuan: true
    fujian: true
    cwa: true
    cenc: true
    chongqing: true

# Delivery targeting is reserved for a later phase; no targeting is active yet.
targets:
  default:
    mode: all
  sources: {}

groups: {}

# Future server entries may override delivery only, never WebSocket/cache/parser ownership.
servers: {}
